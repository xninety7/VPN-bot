global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: 'v2ray-hk'
    static_configs:
      - targets: ['localhost:9101']
        labels:
          server: 'hk-v2ray'

  - job_name: 'v2ray-ph'
    static_configs:
      - targets: ['localhost:9102']
        labels:
          server: 'ph-v2ray'
